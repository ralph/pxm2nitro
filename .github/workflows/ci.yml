name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "hash=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Build
        run: swift build
      - name: Build libraries for iOS
        run: xcodebuild -scheme PXM2NitroUI -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/xcode" build -quiet
      - name: Test
        run: swift test
      - name: Build macOS app
        run: xcodebuild -project App/PXM2Nitro.xcodeproj -scheme PXM2Nitro -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/xcode" CODE_SIGNING_ALLOWED=NO build -quiet
